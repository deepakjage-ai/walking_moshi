<!-- Paste this into Webflow's Page Settings -> "Inside <head> tag" -->
<style>
*, *::before, *::after, html, body, #canvas-container, canvas, select, option, button, a, div, span, p, label, input, img, svg {
  cursor: none !important;
}

html, body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:#000;
}

#canvas-container{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  z-index: 1; /* Puts the canvas behind your Webflow UI */
}

canvas{
  display:block;
}
</style>
